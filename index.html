<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线五子棋 - 网络对战</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 登录/注册页面 -->
    <div id="authPage" class="page">
        <div class="auth-container">
            <h1>🎮 在线五子棋</h1>
            <div class="auth-form">
                <div class="tabs">
                    <button class="tab active" data-tab="login">登录</button>
                    <button class="tab" data-tab="register">注册</button>
                </div>
                
                <!-- 登录表单 -->
                <form id="loginForm" class="form-content active">
                    <div class="form-group">
                        <label for="loginUsername">用户名</label>
                        <input type="text" id="loginUsername" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">密码</label>
                        <input type="password" id="loginPassword" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary">登录</button>
                    <p id="loginError" class="error-message"></p>
                </form>
                
                <!-- 注册表单 -->
                <form id="registerForm" class="form-content">
                    <div class="form-group">
                        <label for="registerUsername">用户名</label>
                        <input type="text" id="registerUsername" placeholder="3-20个字符" required>
                        <small>用户名长度必须在3-20个字符之间</small>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">密码</label>
                        <input type="password" id="registerPassword" placeholder="至少6个字符" required>
                        <small>密码长度至少6个字符</small>
                    </div>
                    <div class="form-group">
                        <label for="registerConfirmPassword">确认密码</label>
                        <input type="password" id="registerConfirmPassword" placeholder="再次输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary">注册</button>
                    <p id="registerError" class="error-message"></p>
                </form>
            </div>
        </div>
    </div>

    <!-- 游戏大厅页面 -->
    <div id="lobbyPage" class="page hidden">
        <div class="container">
            <header class="header">
                <h1>🎮 在线五子棋</h1>
                <div class="user-info">
                    <span id="currentUsername">玩家</span>
                    <span id="currentUserScore">0分</span>
                    <button id="logoutBtn" class="btn btn-secondary btn-sm">退出登录</button>
                </div>
            </header>
            
            <div class="main-content">
                <div class="game-panel">
                    <div class="panel-header">
                        <h2>🎯 游戏大厅</h2>
                    </div>
                    
                    <div class="panel-body">
                        <div class="match-section">
                            <button id="findMatchBtn" class="btn btn-primary btn-lg">
                                🔍 寻找对手
                            </button>
                            <button id="cancelMatchBtn" class="btn btn-secondary btn-lg hidden">
                                ❌ 取消匹配
                            </button>
                            <p id="matchStatus" class="match-status"></p>
                        </div>
                        
                        <div id="gameInfo" class="game-info hidden">
                            <div class="players-info">
                                <div class="player-card black">
                                    <span class="player-name" id="blackPlayerName">黑方玩家</span>
                                    <span class="player-indicator"></span>
                                </div>
                                <div class="vs">VS</div>
                                <div class="player-card white">
                                    <span class="player-indicator"></span>
                                    <span class="player-name" id="whitePlayerName">白方玩家</span>
                                </div>
                            </div>
                            <div class="turn-indicator">
                                <span id="turnIndicator">等待开始</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="board-panel">
                    <div class="panel-header">
                        <h2>♟️ 棋盘</h2>
                    </div>
                    <div class="panel-body">
                        <div id="board" class="board disabled"></div>
                    </div>
                </div>
                
                <div class="ranking-panel">
                    <div class="panel-header">
                        <h2>🏆 排行榜</h2>
                    </div>
                    <div class="panel-body">
                        <ul id="rankingList" class="ranking-list"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 游戏结束弹窗 -->
    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <h2 id="gameOverTitle">游戏结束</h2>
            <p id="gameOverMessage"></p>
            <button id="backToLobbyBtn" class="btn btn-primary">返回大厅</button>
        </div>
    </div>

    <!-- 加载提示 -->
    <div id="loadingOverlay" class="overlay hidden">
        <div class="spinner"></div>
        <p>加载中...</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
