<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温馨家庭空间</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --warm-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.1);
            --shadow-medium: 0 12px 48px rgba(0, 0, 0, 0.12);
            --shadow-hover: 0 16px 64px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 50%, #ffecd2 100%);
            min-height: 100vh;
            color: #2d3436;
            overflow-x: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.2) 0%, transparent 30%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px 40px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-soft);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: var(--primary-gradient);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: var(--shadow-soft);
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .current-user {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--primary-gradient);
            padding: 10px 20px;
            border-radius: 50px;
            color: white;
            font-weight: 500;
            box-shadow: var(--shadow-soft);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .current-user:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .current-user i {
            font-size: 20px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .nav-tab {
            flex: 1;
            min-width: 180px;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid transparent;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #636e72;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: var(--shadow-soft);
        }

        .nav-tab:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-medium);
        }

        .nav-tab.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: var(--shadow-medium);
        }

        .nav-tab i {
            font-size: 20px;
        }

        /* Main Content */
        .content-section {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Family Space Section */
        .family-space {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }

        @media (max-width: 1024px) {
            .family-space {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--shadow-soft);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-medium);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .card-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #2d3436;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-header h2 i {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Check-in Buttons */
        .checkin-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .checkin-btn {
            padding: 24px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: white;
            box-shadow: var(--shadow-soft);
        }

        .checkin-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: var(--shadow-hover);
        }

        .checkin-btn:active {
            transform: translateY(-2px) scale(0.98);
        }

        .checkin-btn i {
            font-size: 36px;
        }

        .exercise-btn {
            background: var(--success-gradient);
        }

        .study-btn {
            background: var(--secondary-gradient);
        }

        /* Activity Feed */
        .activity-feed {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .activity-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            transition: all 0.3s ease;
            animation: slideInLeft 0.5s ease-out;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .activity-item:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateX(5px);
        }

        .activity-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .activity-content {
            flex: 1;
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .activity-name {
            font-weight: 600;
            color: #2d3436;
            font-size: 16px;
        }

        .activity-time {
            font-size: 12px;
            color: #b2bec3;
        }

        .activity-text {
            color: #636e72;
            font-size: 14px;
            line-height: 1.6;
        }

        .activity-points {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--warm-gradient);
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        /* Leaderboard */
        .leaderboard {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .leaderboard-item:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.02);
        }

        .leaderboard-rank {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }

        .leaderboard-rank.rank-1 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .leaderboard-rank.rank-2 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .leaderboard-rank.rank-3 {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        .leaderboard-rank.rank-other {
            background: #dfe6e9;
            color: #636e72;
        }

        .leaderboard-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .leaderboard-info {
            flex: 1;
        }

        .leaderboard-name {
            font-weight: 600;
            color: #2d3436;
            font-size: 15px;
        }

        .leaderboard-points {
            background: var(--warm-gradient);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        /* Message Board */
        .message-board {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
        }

        @media (max-width: 1200px) {
            .message-board {
                grid-template-columns: 1fr;
            }
        }

        .message-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: #2d3436;
            font-size: 14px;
        }

        .form-input,
        .form-textarea {
            padding: 14px 18px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 14px;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            padding: 16px 32px;
            border: none;
            border-radius: 14px;
            background: var(--primary-gradient);
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-soft);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-medium);
        }

        .message-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 600px;
            overflow-y: auto;
        }

        .message-item {
            padding: 20px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-item:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-3px);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .message-sender {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .message-sender-name {
            font-weight: 600;
            color: #2d3436;
            font-size: 15px;
        }

        .message-recipient {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #636e72;
        }

        .message-time {
            font-size: 12px;
            color: #b2bec3;
        }

        .message-content {
            color: #2d3436;
            font-size: 15px;
            line-height: 1.6;
            padding: 12px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
        }

        /* Schedule Section */
        .schedule-section {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
        }

        @media (max-width: 1200px) {
            .schedule-section {
                grid-template-columns: 1fr;
            }
        }

        .event-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .event-item {
            padding: 24px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            transition: all 0.3s ease;
            animation: fadeInRight 0.5s ease-out;
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .event-item:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-5px);
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .event-title {
            font-size: 18px;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 8px;
        }

        .event-date {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #636e72;
        }

        .event-participants {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .participant-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            border: 2px solid white;
        }

        .event-description {
            color: #636e72;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
        }

        .event-actions {
            display: flex;
            gap: 12px;
        }

        .event-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .join-btn {
            background: var(--success-gradient);
            color: white;
        }

        .join-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .event-btn.joined {
            background: #00b894;
            cursor: default;
        }

        /* Create Event Form */
        .event-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 30px;
            right: 30px;
            padding: 18px 28px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--shadow-medium);
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.4s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--success-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            color: #2d3436;
            font-size: 15px;
        }

        .toast-message {
            color: #636e72;
            font-size: 13px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                padding: 20px;
                flex-direction: column;
                gap: 16px;
            }

            .logo h1 {
                font-size: 22px;
            }

            .nav-tabs {
                gap: 8px;
            }

            .nav-tab {
                min-width: 140px;
                padding: 12px 16px;
                font-size: 14px;
            }

            .card {
                padding: 20px;
            }

            .checkin-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-home"></i>
                </div>
                <h1>温馨家庭空间</h1>
            </div>
            <div class="user-info">
                <div class="current-user">
                    <i class="fas fa-user-circle"></i>
                    <span id="currentUser">爸爸</span>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showSection('family-space')">
                <i class="fas fa-users"></i>
                家庭空间
            </button>
            <button class="nav-tab" onclick="showSection('message-board')">
                <i class="fas fa-comments"></i>
                留言板
            </button>
            <button class="nav-tab" onclick="showSection('schedule')">
                <i class="fas fa-calendar-alt"></i>
                家庭日程
            </button>
        </div>

        <!-- Family Space Section -->
        <div id="family-space" class="content-section active">
            <div class="family-space">
                <div class="main-content">
                    <div class="card">
                        <div class="card-header">
                            <h2><i class="fas fa-star"></i> 今日打卡</h2>
                        </div>
                        <div class="checkin-buttons">
                            <button class="checkin-btn exercise-btn" onclick="checkIn('exercise')">
                                <i class="fas fa-running"></i>
                                <span>运动打卡</span>
                                <small style="font-weight: 400; font-size: 14px;">+10 积分</small>
                            </button>
                            <button class="checkin-btn study-btn" onclick="checkIn('study')">
                                <i class="fas fa-book-reader"></i>
                                <span>学习打卡</span>
                                <small style="font-weight: 400; font-size: 14px;">+15 积分</small>
                            </button>
                        </div>

                        <div class="card-header" style="margin-top: 30px;">
                            <h2><i class="fas fa-stream"></i> 家庭动态</h2>
                        </div>
                        <div class="activity-feed" id="activityFeed">
                            <!-- Activities will be loaded here -->
                        </div>
                    </div>
                </div>

                <div class="sidebar">
                    <div class="card">
                        <div class="card-header">
                            <h2><i class="fas fa-trophy"></i> 积分排行榜</h2>
                        </div>
                        <div class="leaderboard" id="leaderboard">
                            <!-- Leaderboard will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Message Board Section -->
        <div id="message-board" class="content-section">
            <div class="message-board">
                <div class="main-content">
                    <div class="card">
                        <div class="card-header">
                            <h2><i class="fas fa-pen"></i> 发送留言</h2>
                        </div>
                        <div class="message-form">
                            <div class="form-group">
                                <label>收件人</label>
                                <select class="form-input" id="messageRecipient">
                                    <option value="all">全体成员</option>
                                    <option value="爸爸">爸爸</option>
                                    <option value="妈妈">妈妈</option>
                                    <option value="小明">小明</option>
                                    <option value="小红">小红</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>留言内容</label>
                                <textarea class="form-textarea" id="messageContent" placeholder="写下你想说的话..."></textarea>
                            </div>
                            <button class="submit-btn" onclick="sendMessage()">
                                <i class="fas fa-paper-plane"></i> 发送留言
                            </button>
                        </div>
                    </div>
                </div>

                <div class="sidebar">
                    <div class="card">
                        <div class="card-header">
                            <h2><i class="fas fa-envelope"></i> 留言列表</h2>
                        </div>
                        <div class="message-list" id="messageList">
                            <!-- Messages will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Schedule Section -->
        <div id="schedule" class="content-section">
            <div class="schedule-section">
                <div class="main-content">
                    <div class="card">
                        <div class="card-header">
                            <h2><i class="fas fa-calendar-week"></i> 家庭活动</h2>
                        </div>
                        <div class="event-list" id="eventList">
                            <!-- Events will be loaded here -->
                        </div>
                    </div>
                </div>

                <div class="sidebar">
                    <div class="card">
                        <div class="card-header">
                            <h2><i class="fas fa-plus-circle"></i> 创建活动</h2>
                        </div>
                        <div class="event-form">
                            <div class="form-group">
                                <label>活动标题</label>
                                <input type="text" class="form-input" id="eventTitle" placeholder="例如：周末郊游">
                            </div>
                            <div class="form-group">
                                <label>活动日期</label>
                                <input type="date" class="form-input" id="eventDate">
                            </div>
                            <div class="form-group">
                                <label>活动描述</label>
                                <textarea class="form-textarea" id="eventDescription" placeholder="描述活动详情..."></textarea>
                            </div>
                            <button class="submit-btn" onclick="createFamilyEvent()">
                                <i class="fas fa-calendar-plus"></i> 创建活动
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <div class="toast-icon">
            <i class="fas fa-check"></i>
        </div>
        <div class="toast-content">
            <div class="toast-title">操作成功</div>
            <div class="toast-message" id="toastMessage">您的操作已完成</div>
        </div>
    </div>

    <script>
        // Initialize data
        let familyMembers = [
            { id: 1, name: '爸爸', points: 85, avatar: '爸' },
            { id: 2, name: '妈妈', points: 92, avatar: '妈' },
            { id: 3, name: '小明', points: 78, avatar: '明' },
            { id: 4, name: '小红', points: 65, avatar: '红' }
        ];

        let activities = [
            { id: 1, user: '小明', type: 'exercise', text: '完成了30分钟慢跑', points: 10, time: '10分钟前' },
            { id: 2, user: '妈妈', type: 'study', text: '阅读了《活着》第一章', points: 15, time: '30分钟前' },
            { id: 3, user: '小红', type: 'exercise', text: '完成了瑜伽练习', points: 10, time: '1小时前' },
            { id: 4, user: '爸爸', type: 'study', text: '学习了Python基础', points: 15, time: '2小时前' }
        ];

        let messages = [
            { id: 1, sender: '妈妈', recipient: '小明', content: '宝贝，记得完成作业哦！', time: '15分钟前' },
            { id: 2, sender: '爸爸', recipient: 'all', content: '这周末我们去郊游吧，天气很好！', time: '1小时前' },
            { id: 3, sender: '小红', recipient: '妈妈', content: '妈妈，我想要新的画画本', time: '2小时前' }
        ];

        let events = [
            { id: 1, title: '周末家庭郊游', date: '2026-03-15', description: '全家一起去公园野餐，带上零食和玩具', participants: ['爸爸', '妈妈'] },
            { id: 2, title: '读书分享会', date: '2026-03-16', description: '每个人分享最近读的一本书', participants: ['小明'] },
            { id: 3, title: '家庭电影夜', date: '2026-03-17', description: '一起看一部温馨的家庭电影', participants: [] }
        ];

        let currentUser = '爸爸';

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadActivities();
            loadLeaderboard();
            loadMessages();
            loadEvents();
            document.getElementById('currentUser').textContent = currentUser;
        });

        // Show section
        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.getElementById(sectionId).classList.add('active');
            event.target.closest('.nav-tab').classList.add('active');
        }

        // Check in
        function checkIn(type) {
            const user = currentUser;
            const text = type === 'exercise' ? '完成了运动打卡' : '完成了学习打卡';
            const points = type === 'exercise' ? 10 : 15;

            // Add activity
            activities.unshift({
                id: Date.now(),
                user: user,
                type: type,
                text: text,
                points: points,
                time: '刚刚'
            });

            // Update points
            const member = familyMembers.find(m => m.name === user);
            if (member) {
                member.points += points;
            }

            // Refresh displays
            loadActivities();
            loadLeaderboard();

            showToast('打卡成功！获得 +' + points + ' 积分');
        }

        // Load activities
        function loadActivities() {
            const feed = document.getElementById('activityFeed');
            feed.innerHTML = activities.map(activity => `
                <div class="activity-item">
                    <div class="activity-avatar">${activity.user.charAt(0)}</div>
                    <div class="activity-content">
                        <div class="activity-header">
                            <span class="activity-name">${activity.user}</span>
                            <span class="activity-time">${activity.time}</span>
                        </div>
                        <div class="activity-text">
                            ${activity.type === 'exercise' ? '<i class="fas fa-running"></i>' : '<i class="fas fa-book-reader"></i>'}
                            ${activity.text}
                        </div>
                        <div class="activity-points">
                            <i class="fas fa-star"></i> +${activity.points} 积分
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Load leaderboard
        function loadLeaderboard() {
            const sortedMembers = [...familyMembers].sort((a, b) => b.points - a.points);
            const leaderboard = document.getElementById('leaderboard');
            
            leaderboard.innerHTML = sortedMembers.map((member, index) => {
                let rankClass = 'rank-other';
                if (index === 0) rankClass = 'rank-1';
                else if (index === 1) rankClass = 'rank-2';
                else if (index === 2) rankClass = 'rank-3';

                return `
                    <div class="leaderboard-item">
                        <div class="leaderboard-rank ${rankClass}">${index + 1}</div>
                        <div class="leaderboard-avatar">${member.avatar}</div>
                        <div class="leaderboard-info">
                            <div class="leaderboard-name">${member.name}</div>
                        </div>
                        <div class="leaderboard-points">${member.points}</div>
                    </div>
                `;
            }).join('');
        }

        // Send message
        function sendMessage() {
            const recipient = document.getElementById('messageRecipient').value;
            const content = document.getElementById('messageContent').value.trim();

            if (!content) {
                showToast('请输入留言内容');
                return;
            }

            messages.unshift({
                id: Date.now(),
                sender: currentUser,
                recipient: recipient,
                content: content,
                time: '刚刚'
            });

            document.getElementById('messageContent').value = '';
            loadMessages();
            showToast('留言发送成功！');
        }

        // Load messages
        function loadMessages() {
            const list = document.getElementById('messageList');
            const recipientText = { all: '全体成员', '爸爸': '爸爸', '妈妈': '妈妈', '小明': '小明', '小红': '小红' };

            list.innerHTML = messages.map(message => `
                <div class="message-item">
                    <div class="message-header">
                        <div class="message-sender">
                            <div class="message-avatar">${message.sender.charAt(0)}</div>
                            <span class="message-sender-name">${message.sender}</span>
                        </div>
                        <span class="message-time">${message.time}</span>
                    </div>
                    <div class="message-recipient">
                        <i class="fas fa-arrow-right"></i>
                        ${recipientText[message.recipient] || message.recipient}
                    </div>
                    <div class="message-content">${message.content}</div>
                </div>
            `).join('');
        }

        // Create event
        function createFamilyEvent() {
            const title = document.getElementById('eventTitle').value.trim();
            const date = document.getElementById('eventDate').value;
            const description = document.getElementById('eventDescription').value.trim();

            if (!title || !date) {
                showToast('请填写活动标题和日期');
                return;
            }

            events.unshift({
                id: Date.now(),
                title: title,
                date: date,
                description: description || '暂无描述',
                participants: []
            });

            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventDescription').value = '';

            loadEvents();
            showToast('活动创建成功！');
        }

        // Join event
        function joinEvent(eventId) {
            const event = events.find(e => e.id === eventId);
            if (event && !event.participants.includes(currentUser)) {
                event.participants.push(currentUser);
                loadEvents();
                showToast('报名成功！');
            }
        }

        // Load events
        function loadEvents() {
            const list = document.getElementById('eventList');

            list.innerHTML = events.map(event => {
                const isJoined = event.participants.includes(currentUser);
                const participantAvatars = event.participants.map(p => `
                    <div class="participant-avatar">${p.charAt(0)}</div>
                `).join('');

                return `
                    <div class="event-item">
                        <div class="event-header">
                            <div>
                                <div class="event-title">${event.title}</div>
                                <div class="event-date">
                                    <i class="fas fa-calendar"></i> ${event.date}
                                </div>
                            </div>
                        </div>
                        <div class="event-participants">
                            ${participantAvatars}
                            <span style="color: #636e72; font-size: 14px;">${event.participants.length} 人参加</span>
                        </div>
                        <div class="event-description">${event.description}</div>
                        <div class="event-actions">
                            <button class="event-btn ${isJoined ? 'joined' : 'join-btn'}" 
                                    onclick="joinEvent(${event.id})" 
                                    ${isJoined ? 'disabled' : ''}>
                                ${isJoined ? '<i class="fas fa-check"></i> 已报名' : '<i class="fas fa-plus"></i> 报名参加'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Show toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
